<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      data-i18n-content="meta.description"
      content="Локальный генератор sing-box config.json для OpenWrt"
    />
    <title>Sing-box Config Builder</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #081016;
  --panel: rgba(15, 27, 36, 0.9);
  --panel-2: rgba(21, 38, 49, 0.88);
  --line: rgba(171, 207, 219, 0.14);
  --text: #eef8f7;
  --muted: #9bb2b5;
  --accent: #45e0a8;
  --accent-2: #58a6ff;
  --warn: #ffc46b;
  --danger: #ff7b86;
  --ok: #68e5a9;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 0%, rgba(55, 190, 151, 0.18), transparent 31rem),
    radial-gradient(circle at 95% 20%, rgba(67, 126, 219, 0.15), transparent 34rem),
    var(--bg);
  color: var(--text);
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.shell {
  width: min(1920px, calc(100% - 32px));
  margin: 0 auto;
  padding: 30px 0 60px;
}

.hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  padding: 28px;
  margin-bottom: 18px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: linear-gradient(135deg, rgba(18, 38, 48, 0.96), rgba(9, 21, 29, 0.92));
  box-shadow: var(--shadow);
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.pulse {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 18px var(--accent);
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  max-width: 760px;
  margin-bottom: 10px;
  font-size: clamp(2rem, 5vw, 4.2rem);
  line-height: 0.98;
  letter-spacing: -0.055em;
}

h2 {
  margin-bottom: 8px;
  font-size: 1.18rem;
}

h3 {
  margin-bottom: 6px;
  font-size: 0.98rem;
}

.hero p {
  max-width: 760px;
  margin-bottom: 0;
  color: var(--muted);
  line-height: 1.6;
}

.language-switch {
  display: inline-flex;
  flex: 0 0 auto;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(3, 12, 18, 0.52);
}

.language-switch a {
  padding: 7px 10px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 850;
  text-decoration: none;
}

.language-switch a:hover {
  color: var(--text);
}

.language-switch a.active {
  background: rgba(69, 224, 168, 0.13);
  color: var(--accent);
}

.notice {
  margin-bottom: 18px;
  padding: 15px 17px;
  border: 1px solid rgba(255, 196, 107, 0.22);
  border-radius: 16px;
  background: rgba(255, 196, 107, 0.07);
  color: #f5d9a8;
  line-height: 1.5;
}

.notice strong,
.notice span {
  display: block;
}

.notice strong {
  margin-bottom: 4px;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
  gap: 18px;
  align-items: start;
}

.stack {
  display: grid;
  gap: 18px;
}

.card {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}

.card-head p,
.hint {
  margin-bottom: 0;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.5;
}

.count {
  flex: 0 0 auto;
  padding: 7px 10px;
  border-radius: 10px;
  background: rgba(88, 166, 255, 0.1);
  color: #9bcbff;
  font-size: 0.78rem;
  font-weight: 750;
}

.source-list {
  display: grid;
  gap: 12px;
}

.source {
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--panel-2);
}

.source-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 210px;
  gap: 10px;
}

label {
  display: grid;
  gap: 7px;
  color: #c6d8da;
  font-size: 0.82rem;
  font-weight: 700;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid rgba(171, 207, 219, 0.16);
  border-radius: 12px;
  outline: none;
  background: rgba(3, 12, 18, 0.72);
  color: var(--text);
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

input {
  height: 44px;
  padding: 0 12px;
}

textarea {
  min-height: 116px;
  padding: 12px;
  resize: vertical;
  line-height: 1.45;
}

input:focus,
textarea:focus,
select:focus {
  border-color: rgba(69, 224, 168, 0.72);
  box-shadow: 0 0 0 3px rgba(69, 224, 168, 0.1);
}

.source-actions,
.toolbar,
.output-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 11px;
}

.hwid-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 9px 13px;
  border: 1px solid rgba(171, 207, 219, 0.16);
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.045);
  cursor: pointer;
}

.hwid-toggle input {
  width: 17px;
  height: 17px;
  margin: 0;
  accent-color: var(--accent);
}

.hwid-toggle span {
  white-space: nowrap;
}

.source-actions + .hint {
  margin-top: 10px;
}

.btn {
  min-height: 40px;
  padding: 9px 13px;
  border: 1px solid transparent;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.07);
  color: var(--text);
  font-weight: 760;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.11);
}

.btn-primary {
  background: var(--accent);
  color: #062219;
}

.btn-primary:hover {
  background: #6debbb;
}

.btn-blue {
  border-color: rgba(88, 166, 255, 0.3);
  background: rgba(88, 166, 255, 0.12);
  color: #b7daff;
}

.btn-danger {
  color: #ffabb2;
}

.file-label {
  display: inline-flex;
  align-items: center;
}

.file-label input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

details {
  margin-top: 11px;
}

summary {
  cursor: pointer;
  color: #a9c2c4;
  font-size: 0.84rem;
  font-weight: 700;
}

.raw-input {
  margin-top: 10px;
  min-height: 100px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.77rem;
}

.node-picker {
  margin-top: 13px;
  padding: 12px;
  border: 1px solid rgba(88, 166, 255, 0.18);
  border-radius: 14px;
  background: rgba(3, 12, 18, 0.34);
}

.node-picker > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  list-style-position: inside;
}

.node-picker-count {
  color: #9bcbff;
  font-size: 0.75rem;
  font-weight: 800;
}

.node-picker-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 11px 0;
}

.node-search {
  flex: 1 1 220px;
  min-width: 0;
}

.node-picker-toolbar .btn {
  min-height: 36px;
  padding: 7px 10px;
  font-size: 0.76rem;
}

.node-options {
  display: grid;
  gap: 6px;
  max-height: 330px;
  overflow: auto;
  padding-right: 4px;
}

.node-option {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 9px;
  align-items: start;
  padding: 9px 10px;
  border: 1px solid rgba(171, 207, 219, 0.1);
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.025);
  cursor: pointer;
}

.node-option:hover {
  border-color: rgba(69, 224, 168, 0.3);
}

.node-option.unsupported {
  cursor: not-allowed;
  opacity: 0.58;
}

.node-option input[type="checkbox"] {
  width: 17px;
  height: 17px;
  margin: 2px 0 0;
  accent-color: var(--accent);
}

.node-option-copy {
  min-width: 0;
}

.node-option-name {
  display: block;
  overflow-wrap: anywhere;
  color: var(--text);
  font-size: 0.82rem;
  font-weight: 760;
}

.node-option-meta {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 600;
}

.status {
  margin-top: 10px;
  color: var(--muted);
  font-size: 0.82rem;
}

.status.ok {
  color: var(--ok);
}

.status.warn {
  color: var(--warn);
}

.status.bad {
  color: var(--danger);
}

#directDomains {
  min-height: 330px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.78rem;
}

.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.build-button {
  width: 100%;
  min-height: 56px;
  margin-top: 16px;
  border: 0;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--accent), #67b9ff);
  color: #041c1b;
  font-size: 1rem;
  font-weight: 900;
  box-shadow: 0 14px 32px rgba(69, 224, 168, 0.2);
}

.build-button:hover {
  filter: brightness(1.06);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 14px;
}

.stat {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.035);
}

.stat-value {
  display: block;
  margin-bottom: 3px;
  color: var(--accent);
  font-size: 1.45rem;
  font-weight: 900;
}

.stat-label {
  color: var(--muted);
  font-size: 0.72rem;
}

#jsonOutput {
  min-height: 430px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.73rem;
}

.commands {
  position: relative;
  margin: 0;
  padding: 17px;
  overflow-x: auto;
  border: 1px solid rgba(69, 224, 168, 0.18);
  border-radius: 14px;
  background: #030b10;
  color: #b9f8df;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.78rem;
  line-height: 1.7;
  white-space: pre;
}

.footer-note {
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.8rem;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 30;
  max-width: min(420px, calc(100% - 40px));
  padding: 13px 16px;
  border: 1px solid rgba(69, 224, 168, 0.35);
  border-radius: 13px;
  background: #112b27;
  color: #dffcf1;
  box-shadow: var(--shadow);
}

@media (max-width: 980px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .hero {
    align-items: stretch;
  }

  .language-switch {
    align-self: flex-start;
  }
}

@media (max-width: 620px) {
  .shell {
    width: min(100% - 18px, 1920px);
    padding-top: 10px;
  }

  .hero,
  .card {
    padding: 17px;
    border-radius: 18px;
  }

  .source-grid,
  .settings-grid {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 2.4rem;
  }
}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <div class="eyebrow"><span class="pulse"></span> OpenWrt toolkit</div>
          <h1>Sing-box Config Builder</h1>
          <p data-i18n-html="hero.description"></p>
        </div>
        <nav class="language-switch" aria-label="Language">
          <a href="sing-box-config-builder.html" data-locale-link="ru">RU</a>
          <a href="sing-box-config-builder.en.html" data-locale-link="en">EN</a>
        </nav>
      </header>

      <div class="notice">
        <strong data-i18n="notice.title"></strong>
        <span id="backendHelp" data-i18n-html="notice.body"></span>
      </div>

      <div class="layout">
        <div class="stack">
          <section class="card">
            <div class="card-head">
              <div>
                <h2 data-i18n="subscriptions.title"></h2>
                <p data-i18n="subscriptions.description"></p>
              </div>
              <span class="count" id="sourceSummary" data-i18n="summary.zeroNodes"></span>
            </div>

            <div class="source-list" id="sourceList"></div>
            <div class="toolbar">
              <button class="btn btn-blue" id="addSource" type="button" data-i18n="subscriptions.add"></button>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <div>
                <h2 data-i18n="direct.title"></h2>
                <p data-i18n="direct.description"></p>
              </div>
              <span class="count" id="domainCount"></span>
            </div>
            <textarea
              id="directDomains"
              spellcheck="false"
              data-i18n-aria-label="direct.aria"
            ></textarea>
            <div class="toolbar">
              <button class="btn" id="resetDomains" type="button" data-i18n="direct.reset"></button>
              <button class="btn" id="sortDomains" type="button" data-i18n="direct.sort"></button>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <div>
                <h2 data-i18n="settings.title"></h2>
                <p data-i18n="settings.description"></p>
              </div>
            </div>
            <div class="settings-grid">
              <label>
                <span data-i18n="settings.healthInterval"></span>
                <input id="healthInterval" value="20m" />
              </label>
              <label>
                <span data-i18n="settings.controllerAddress"></span>
                <input id="controllerAddress" value="0.0.0.0:9090" />
              </label>
              <label>
                <span data-i18n="settings.controllerSecret"></span>
                <input id="controllerSecret" autocomplete="new-password" />
              </label>
              <label>
                <span data-i18n="settings.tunName"></span>
                <input id="tunName" value="singtun0" />
              </label>
            </div>
            <button class="build-button" id="buildConfig" type="button" data-i18n="settings.build"></button>
            <div class="status warn" data-i18n-html="settings.warning"></div>
            <div class="status" id="buildStatus" data-i18n="settings.initialStatus"></div>
          </section>
        </div>

        <aside class="stack">
          <section class="card">
            <div class="card-head">
              <div>
                <h2 data-i18n="output.title"></h2>
                <p data-i18n="output.description"></p>
              </div>
            </div>

            <div class="stats">
              <div class="stat">
                <span class="stat-value" id="nodeStat">0</span>
                <span class="stat-label" data-i18n="output.tunnels"></span>
              </div>
              <div class="stat">
                <span class="stat-value" id="skippedStat">0</span>
                <span class="stat-label" data-i18n="output.skipped"></span>
              </div>
              <div class="stat">
                <span class="stat-value" id="directStat">0</span>
                <span class="stat-label" data-i18n="output.directDomains"></span>
              </div>
            </div>
            <div class="status warn hidden" id="skippedDetails"></div>

            <textarea
              id="jsonOutput"
              spellcheck="false"
              readonly
              data-i18n-placeholder="output.placeholder"
              data-i18n-aria-label="output.aria"
            ></textarea>
            <div class="output-actions">
              <button class="btn btn-primary" id="downloadConfig" type="button" disabled data-i18n="output.download"></button>
              <button class="btn" id="copyConfig" type="button" disabled data-i18n="output.copy"></button>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <div>
                <h2 data-i18n="commands.title"></h2>
                <p data-i18n-html="commands.description"></p>
              </div>
            </div>
            <pre class="commands" id="commands">rm -f /etc/sing-box/cache.db

sing-box check -c /etc/sing-box/config.json

/etc/init.d/sing-box enable
/etc/init.d/sing-box restart</pre>
            <div class="output-actions">
              <button class="btn" id="copyCommands" type="button" data-i18n="commands.copy"></button>
            </div>
            <p class="footer-note" data-i18n-html="commands.checkHint"></p>
            <h3 data-i18n="commands.recoveryTitle"></h3>
            <pre class="commands" id="recoveryCommands">/etc/init.d/sing-box stop
/etc/init.d/sing-box disable</pre>
            <div class="output-actions">
              <button class="btn btn-danger" id="copyRecovery" type="button" data-i18n="commands.recoveryCopy"></button>
            </div>
          </section>
        </aside>
      </div>
    </main>

// Shared validation and normalization helpers.



function safeDecode(value) {
  try {
    return decodeURIComponent(value);
  } catch {
    return value;
  }
}

function truthy(value) {
  return value === "1" || value === "true";
}

function normalizeServerHost(value) {
  let host = String(value || "").trim().toLowerCase();
  if (host.startsWith("[") && host.endsWith("]")) {
    host = host.slice(1, -1);
  }
  host = host.replace(/\.$/, "");
  if (
    !host ||
    host.length > 253 ||
    host.includes("%") ||
    /[^\x21-\x7e]/.test(host)
  ) {
    return "";
  }

  if (host.includes(":")) {
    if (!/^[0-9a-f:.]+$/i.test(host) || host.includes(":::")) return "";
    if (
      host === "::" ||
      host === "::1" ||
      host.startsWith("fc") ||
      host.startsWith("fd") ||
      /^fe[89ab]/.test(host)
    ) {
      return "";
    }
    return host;
  }

  if (/^[0-9.]+$/.test(host)) {
    const parts = host.split(".");
    if (
      parts.length !== 4 ||
      parts.some(
        (part) =>
          !/^\d{1,3}$/.test(part) ||
          Number(part) > 255 ||
          (part.length > 1 && part.startsWith("0")),
      )
    ) {
      return "";
    }
    const octets = parts.map(Number);
    if (
      octets[0] === 0 ||
      octets[0] === 10 ||
      octets[0] === 127 ||
      (octets[0] === 100 && octets[1] >= 64 && octets[1] <= 127) ||
      (octets[0] === 169 && octets[1] === 254) ||
      (octets[0] === 172 && octets[1] >= 16 && octets[1] <= 31) ||
      (octets[0] === 192 && octets[1] === 168) ||
      (octets[0] === 198 && (octets[1] === 18 || octets[1] === 19)) ||
      octets[0] >= 224
    ) {
      return "";
    }
    return host;
  }

  const labels = host.split(".");
  if (
    labels.length < 2 ||
    labels.some(
      (label) =>
        !/^[a-z0-9-]{1,63}$/i.test(label) ||
        label.startsWith("-") ||
        label.endsWith("-"),
    )
  ) {
    return "";
  }
  return host;
}

function normalizeServerPort(value, fallback = 443) {
  const port = Number(value || fallback);
  return Number.isInteger(port) && port >= 1 && port <= 65535
    ? port
    : 0;
}

function normalizeVlessUuid(value) {
  const uuid = safeDecode(String(value || "")).trim();
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(
    uuid,
  )
    ? uuid
    : "";
}

function safeTransportText(value, fallback = "", maxLength = 1024) {
  if (typeof value !== "string") return fallback;
  const text = value.trim();
  return text.length <= maxLength && !/[\x00-\x1f\x7f]/.test(text)
    ? text
    : fallback;
}

function entryName(entry, index, prefix) {
  if (typeof entry === "string") {
    try {
      const uri = new URL(entry);
      if (uri.hash) {
        return `${prefix}${safeDecode(uri.hash.slice(1)).replace(/\+/g, " ")}`;
      }
    } catch {
      // Use generated name.
    }
  } else if (entry?.remarks) {
    return `${prefix}${entry.remarks}`;
  } else if (entry?.tag) {
    return `${prefix}${entry.tag}`;
  }
  return `${prefix}${t("node.generated", {
    number: String(index + 1).padStart(2, "0"),
  })}`;
}

function unsupportedNode(entry, index, prefix, reason) {
  return {
    outbound: null,
    tag: entryName(entry, index, prefix),
    reason,
    sourceType: `unsupported:${reason}`,
  };
}

function makeTagsUnique(nodes) {
  const occurrences = new Map();
  for (const node of nodes) {
    const original = node.tag;
    const count = (occurrences.get(original) || 0) + 1;
    occurrences.set(original, count);
    if (count > 1) node.tag = `${original} [${count}]`;
  }
}

// TLS and transport conversion for supported subscription formats.



function tlsFromLink(uri, server) {
  const params = uri.searchParams;
  const security = params.get("security");
  if (security !== "tls" && security !== "reality") return undefined;

  const serverName = normalizeServerHost(params.get("sni") || server);
  if (!serverName) return null;

  const tls = {
    enabled: true,
    server_name: serverName,
    insecure:
      truthy(params.get("allowInsecure")) ||
      truthy(params.get("insecure")),
  };
  const alpn = params.get("alpn");
  if (alpn) tls.alpn = alpn.split(",").filter(Boolean);
  const fingerprint = params.get("fp");
  if (fingerprint) {
    tls.utls = { enabled: true, fingerprint };
  }
  if (security === "reality") {
    const publicKey = params.get("pbk") || "";
    if (!publicKey) return null;
    tls.reality = {
      enabled: true,
      public_key: publicKey,
    };
    const shortId = params.get("sid");
    if (shortId) tls.reality.short_id = shortId;
  }
  return tls;
}

function tlsFromXray(stream, server) {
  const security = stream?.security;
  if (security !== "tls" && security !== "reality") return undefined;
  const source =
    security === "reality"
      ? stream.realitySettings || {}
      : stream.tlsSettings || {};
  const serverName = normalizeServerHost(source.serverName || server);
  if (!serverName) return null;
  const tls = {
    enabled: true,
    server_name: serverName,
    insecure: Boolean(source.allowInsecure),
  };
  if (Array.isArray(source.alpn) && source.alpn.length) {
    tls.alpn = source.alpn;
  }
  if (source.fingerprint) {
    tls.utls = {
      enabled: true,
      fingerprint: source.fingerprint,
    };
  }
  if (security === "reality") {
    if (!source.publicKey) return null;
    tls.reality = {
      enabled: true,
      public_key: source.publicKey || "",
    };
    if (source.shortId) tls.reality.short_id = source.shortId;
  }
  return tls;
}

function transportFromLink(params) {
  const sourceType = (params.get("type") || "tcp").toLowerCase();
  if (sourceType === "tcp" || sourceType === "raw") {
    return { sourceType, fallback: false };
  }
  if (sourceType === "xhttp" || sourceType === "splithttp") {
    return { sourceType, fallback: true };
  }
  if (sourceType === "grpc") {
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "grpc",
        service_name:
          params.get("serviceName") ||
          params.get("service_name") ||
          "",
      },
    };
  }
  if (sourceType === "ws") {
    const transport = {
      type: "ws",
      path: params.get("path") || "/",
    };
    const host = params.get("host");
    if (host) transport.headers = { Host: host };
    return { sourceType, fallback: false, transport };
  }
  if (sourceType === "http" || sourceType === "h2") {
    const host = params.get("host");
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "http",
        host: host ? host.split(",").filter(Boolean) : [],
        path: params.get("path") || "/",
      },
    };
  }
  if (sourceType === "httpupgrade") {
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "httpupgrade",
        host: params.get("host") || "",
        path: params.get("path") || "/",
      },
    };
  }
  return { sourceType, fallback: true };
}

function transportFromXray(stream = {}) {
  const sourceType = (stream.network || "tcp").toLowerCase();
  if (sourceType === "tcp" || sourceType === "raw") {
    return { sourceType, fallback: false };
  }
  if (sourceType === "xhttp" || sourceType === "splithttp") {
    return { sourceType, fallback: true };
  }
  if (sourceType === "grpc") {
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "grpc",
        service_name: stream.grpcSettings?.serviceName || "",
      },
    };
  }
  if (sourceType === "ws") {
    const transport = {
      type: "ws",
      path: stream.wsSettings?.path || "/",
    };
    const host =
      stream.wsSettings?.headers?.Host ||
      stream.wsSettings?.headers?.host;
    if (host) transport.headers = { Host: host };
    return { sourceType, fallback: false, transport };
  }
  if (sourceType === "http" || sourceType === "h2") {
    const settings =
      stream.httpSettings || stream.http2Settings || {};
    const hosts = Array.isArray(settings.host)
      ? settings.host
      : settings.host
        ? [settings.host]
        : [];
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "http",
        host: hosts,
        path: settings.path || "/",
      },
    };
  }
  if (sourceType === "httpupgrade") {
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "httpupgrade",
        host: stream.httpupgradeSettings?.host || "",
        path: stream.httpupgradeSettings?.path || "/",
      },
    };
  }
  return { sourceType, fallback: true };
}

function transportFromSingBox(source = {}) {
  if (!source || typeof source !== "object") {
    return { sourceType: "tcp", fallback: false };
  }
  const sourceType = String(source.type || "tcp").toLowerCase();
  if (sourceType === "tcp" || sourceType === "raw") {
    return { sourceType, fallback: false };
  }
  if (sourceType === "xhttp" || sourceType === "splithttp") {
    return { sourceType, fallback: true };
  }
  if (sourceType === "grpc") {
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "grpc",
        service_name: safeTransportText(source.service_name),
      },
    };
  }
  if (sourceType === "ws") {
    const transport = {
      type: "ws",
      path: safeTransportText(source.path, "/"),
    };
    const host = safeTransportText(
      source.headers?.Host || source.headers?.host,
      "",
      253,
    );
    if (host) transport.headers = { Host: host };
    return { sourceType, fallback: false, transport };
  }
  if (sourceType === "http") {
    const hosts = (Array.isArray(source.host)
      ? source.host
      : source.host
        ? [source.host]
        : []
    )
      .map((host) => safeTransportText(host, "", 253))
      .filter(Boolean);
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "http",
        host: hosts,
        path: safeTransportText(source.path, "/"),
      },
    };
  }
  if (sourceType === "httpupgrade") {
    return {
      sourceType,
      fallback: false,
      transport: {
        type: "httpupgrade",
        host: safeTransportText(source.host, "", 253),
        path: safeTransportText(source.path, "/"),
      },
    };
  }
  return { sourceType, fallback: true };
}

function tlsFromSingBox(source, server) {
  if (!source?.enabled) return undefined;
  const serverName = normalizeServerHost(source.server_name || server);
  if (!serverName) return null;
  const tls = {
    enabled: true,
    server_name: serverName,
    insecure: Boolean(source.insecure),
  };
  if (Array.isArray(source.alpn)) {
    const alpn = source.alpn
      .map((item) => safeTransportText(item, "", 64))
      .filter(Boolean);
    if (alpn.length) tls.alpn = alpn;
  }
  if (source.utls?.enabled && source.utls?.fingerprint) {
    const fingerprint = safeTransportText(
      source.utls.fingerprint,
      "",
      64,
    );
    if (fingerprint) {
      tls.utls = { enabled: true, fingerprint };
    }
  }
  if (source.reality?.enabled) {
    const publicKey = safeTransportText(
      source.reality.public_key,
      "",
      256,
    );
    if (!publicKey) return null;
    tls.reality = { enabled: true, public_key: publicKey };
    const shortId = safeTransportText(
      source.reality.short_id,
      "",
      32,
    );
    if (shortId) tls.reality.short_id = shortId;
  }
  return tls;
}

// Pure subscription decoding and sing-box outbound conversion.

// This file is inlined before app.js by the build script.

function decodeBase64(value) {
  const normalized = value
    .replace(/\s+/g, "")
    .replace(/-/g, "+")
    .replace(/_/g, "/");
  const padded =
    normalized + "=".repeat((4 - (normalized.length % 4)) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, (character) =>
    character.charCodeAt(0),
  );
  return new TextDecoder().decode(bytes);
}

function decodeSubscription(text) {
  const input = text.trim();
  if (!input) throw new Error(t("subscription.empty"));

  try {
    const parsed = JSON.parse(input);
    if (Array.isArray(parsed)) {
      const hasNativeOutbounds = parsed.some(
        (item) => item && typeof item === "object" && item.type,
      );
      return hasNativeOutbounds
        ? parsed.filter((item) =>
            ["vless", "trojan", "hysteria2"].includes(item?.type),
          )
        : parsed;
    }
    if (Array.isArray(parsed.links)) return parsed.links;
    if (
      parsed &&
      typeof parsed === "object" &&
      Array.isArray(parsed.outbounds)
    ) {
      const hasNativeOutbounds = parsed.outbounds.some(
        (item) => item && typeof item === "object" && item.type,
      );
      if (hasNativeOutbounds) {
        const nodes = parsed.outbounds.filter((item) =>
          ["vless", "trojan", "hysteria2"].includes(item?.type),
        );
        if (nodes.length === 0) {
          throw new Error(t("subscription.noSupportedJsonNodes"));
        }
        return nodes;
      }
      return [parsed];
    }
  } catch {
    // Continue with URI text or base64.
  }

  let linkText = input;
  if (!linkText.includes("://")) {
    const decoded = decodeBase64(linkText);
    if (decoded.includes("://")) linkText = decoded;
  }

  const links = linkText
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean);
  if (links.length === 0) throw new Error(t("subscription.noNodes"));
  return links;
}

function parseLink(link, index, prefix) {
  let uri;
  try {
    uri = new URL(link);
  } catch {
    return unsupportedNode(link, index, prefix, t("reason.invalidLink"));
  }

  const scheme = uri.protocol.slice(0, -1);
  const params = uri.searchParams;
  const tag = entryName(link, index, prefix);
  const server = normalizeServerHost(uri.hostname);
  const serverPort = normalizeServerPort(uri.port);
  if (!server || !serverPort) {
    return unsupportedNode(
      link,
      index,
      prefix,
      t("reason.invalidServer"),
    );
  }
  const rawServerName = params.get("sni");
  if (rawServerName && !normalizeServerHost(rawServerName)) {
    return unsupportedNode(link, index, prefix, t("reason.invalidSni"));
  }

  if (scheme === "vless") {
    const transportInfo = transportFromLink(params);
    if (transportInfo.fallback) {
      return unsupportedNode(
        link,
        index,
        prefix,
        transportInfo.sourceType === "xhttp" ||
          transportInfo.sourceType === "splithttp"
          ? t("reason.xhttpUnsupported")
          : t("reason.unsupportedTransport", {
              transport: transportInfo.sourceType,
            }),
      );
    }
    const uuid = normalizeVlessUuid(uri.username);
    if (!uuid) {
      return unsupportedNode(link, index, prefix, t("reason.invalidVlessUuid"));
    }
    const outbound = {
      type: "vless",
      tag,
      server,
      server_port: serverPort,
      uuid,
    };
    const flow = params.get("flow");
    if (flow) outbound.flow = flow;
    const packetEncoding = params.get("packetEncoding");
    if (packetEncoding) outbound.packet_encoding = packetEncoding;
    const tls = tlsFromLink(uri, server);
    if (tls === null) {
      return unsupportedNode(link, index, prefix, t("reason.invalidTlsReality"));
    }
    if (tls) outbound.tls = tls;
    if (transportInfo.transport) {
      outbound.transport = transportInfo.transport;
    }
    return { outbound, ...transportInfo };
  }

  if (scheme === "trojan") {
    const transportInfo = transportFromLink(params);
    if (transportInfo.fallback) {
      return unsupportedNode(
        link,
        index,
        prefix,
        t("reason.unsupportedTransport", {
          transport: transportInfo.sourceType,
        }),
      );
    }
    const outbound = {
      type: "trojan",
      tag,
      server,
      server_port: serverPort,
      password: safeDecode(uri.username),
    };
    const tls = tlsFromLink(uri, server);
    if (tls === null) {
      return unsupportedNode(link, index, prefix, t("reason.invalidTlsReality"));
    }
    outbound.tls = tls || { enabled: true, server_name: server };
    if (transportInfo.transport) {
      outbound.transport = transportInfo.transport;
    }
    return { outbound, ...transportInfo };
  }

  if (scheme === "hysteria2" || scheme === "hy2") {
    return {
      outbound: {
        type: "hysteria2",
        tag,
        server,
        server_port: serverPort,
        password: safeDecode(uri.username),
        tls: {
          enabled: true,
          server_name:
            normalizeServerHost(params.get("sni") || server) || server,
          insecure: truthy(params.get("insecure")),
        },
      },
      fallback: false,
      sourceType: "hysteria2",
    };
  }

  return unsupportedNode(
    link,
    index,
    prefix,
    t("reason.unsupportedProtocol", {
      protocol: scheme || t("reason.unknownProtocol"),
    }),

}

function parseXray(config, index, prefix) {

    return unsupportedNode(
      config,
      index,

  }
  const protocol = sourceOutbound.protocol;
  const stream = sourceOutbound.streamSettings || {};
  const tag = entryName(config, index, prefix);

  if (protocol === "vless") {
    const destination = sourceOutbound.settings?.vnext?.[0];
    const user = destination?.users?.[0];
    if (!destination || !user) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidVless"),
      );
    }
    const transportInfo = transportFromXray(stream);
    if (transportInfo.fallback) {
      return unsupportedNode(
        config,
        index,
        prefix,
        transportInfo.sourceType === "xhttp" ||
          transportInfo.sourceType === "splithttp"
          ? t("reason.xhttpUnsupported")
          : t("reason.unsupportedTransport", {
              transport: transportInfo.sourceType,
            }),
      );
    }
    const server = normalizeServerHost(destination.address);
    const serverPort = normalizeServerPort(destination.port);
    const uuid = normalizeVlessUuid(user.id);
    if (!server || !serverPort || !uuid) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidVlessTarget"),
      );
    }
    const outbound = {
      type: "vless",
      tag,
      server,
      server_port: serverPort,
      uuid,
    };
    if (user.flow) outbound.flow = user.flow;
    if (user.packetEncoding) {
      outbound.packet_encoding = user.packetEncoding;
    }
    const tls = tlsFromXray(stream, server);
    if (tls === null) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidTlsReality"),
      );
    }
    if (tls) outbound.tls = tls;
    if (transportInfo.transport) {
      outbound.transport = transportInfo.transport;
    }
    return { outbound, ...transportInfo };
  }

  if (protocol === "trojan") {
    const destination = sourceOutbound.settings?.servers?.[0];
    if (!destination) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidTrojan"),
      );
    }
    const transportInfo = transportFromXray(stream);
    if (transportInfo.fallback) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.unsupportedTransport", {
          transport: transportInfo.sourceType,
        }),
      );
    }
    const server = normalizeServerHost(destination.address);
    const serverPort = normalizeServerPort(destination.port);
    if (!server || !serverPort || !destination.password) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidTrojan"),
      );
    }
    const outbound = {
      type: "trojan",
      tag,
      server,
      server_port: serverPort,
      password: destination.password,
    };
    const tls = tlsFromXray(stream, server);
    if (tls === null) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidTlsReality"),
      );
    }
    if (tls) outbound.tls = tls;
    if (transportInfo.transport) {
      outbound.transport = transportInfo.transport;
    }
    return { outbound, ...transportInfo };

    protocol === "hysteria2" ||
    (protocol === "hysteria" &&

    const server = normalizeServerHost(settings.address);
    const serverPort = normalizeServerPort(settings.port);
    if (!server || !serverPort) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidHysteria2"),
      );
    }
    const outbound = {
      type: "hysteria2",
      tag,
      server,
      server_port: serverPort,
      password:
        stream.hysteriaSettings?.auth ||
        settings.auth ||
        settings.password ||
        "",
    };
    const tls = tlsFromXray(stream, server);
    if (tls === null) {
      return unsupportedNode(
        config,
        index,
        prefix,
        t("reason.invalidHysteria2Tls"),
      );
    }
    if (tls) outbound.tls = tls;
    return {
      outbound,
      fallback: false,
      sourceType: "hysteria2",
    };
  }

  return unsupportedNode(
    config,
    index,
    prefix,
    t("reason.unsupportedProtocol", {
      protocol: protocol || t("reason.unknownProtocol"),
    }),
  );
}

function parseSingBoxOutbound(source, index, prefix) {
  const type = String(source?.type || "").toLowerCase();
  const tag = entryName(source, index, prefix);
  const server = normalizeServerHost(source?.server);
  const serverPort = normalizeServerPort(source?.server_port);
  if (!server || !serverPort) {
    return unsupportedNode(
      source,
      index,
      prefix,
      t("reason.invalidServer"),
    );
  }

  const transportInfo = transportFromSingBox(source.transport);
  if (transportInfo.fallback) {
    return unsupportedNode(
      source,
      index,
      prefix,
      transportInfo.sourceType === "xhttp" ||
        transportInfo.sourceType === "splithttp"
        ? t("reason.xhttpUnsupported")
        : t("reason.unsupportedTransport", {
            transport: transportInfo.sourceType,
          }),
    );
  }

  if (type === "vless") {
    const uuid = normalizeVlessUuid(source.uuid);
    if (!uuid) {
      return unsupportedNode(
        source,
        index,
        prefix,
        t("reason.invalidVlessUuid"),
      );
    }
    const outbound = {
      type: "vless",
      tag,
      server,
      server_port: serverPort,
      uuid,
    };
    const flow = safeTransportText(source.flow, "", 64);
    if (flow) outbound.flow = flow;
    const packetEncoding = safeTransportText(
      source.packet_encoding,
      "",
      32,
    );
    if (packetEncoding) outbound.packet_encoding = packetEncoding;
    const tls = tlsFromSingBox(source.tls, server);
    if (tls === null) {
      return unsupportedNode(
        source,
        index,
        prefix,
        t("reason.invalidTlsReality"),
      );
    }
    if (tls) outbound.tls = tls;
    if (transportInfo.transport) {
      outbound.transport = transportInfo.transport;
    }
    return { outbound, ...transportInfo };
  }

  if (type === "trojan") {
    const password = String(source.password || "");
    if (!password) {
      return unsupportedNode(
        source,
        index,
        prefix,
        t("reason.missingTrojanPassword"),
      );
    }
    const outbound = {
      type: "trojan",
      tag,
      server,
      server_port: serverPort,
      password,
    };
    const tls = tlsFromSingBox(source.tls, server);
    if (tls === null) {
      return unsupportedNode(
        source,
        index,
        prefix,
        t("reason.invalidTlsReality"),
      );
    }
    outbound.tls = tls || { enabled: true, server_name: server };
    if (transportInfo.transport) {
      outbound.transport = transportInfo.transport;
    }
    return { outbound, ...transportInfo };
  }

  if (type === "hysteria2") {
    const password = String(source.password || "");
    if (!password) {
      return unsupportedNode(
        source,
        index,
        prefix,
        t("reason.missingHysteria2Password"),
      );
    }
    const tls = tlsFromSingBox(source.tls, server);
    if (!tls) {
      return unsupportedNode(
        source,
        index,
        prefix,
        t("reason.invalidHysteria2Tls"),
      );
    }
    const outbound = {
      type: "hysteria2",
      tag,
      server,
      server_port: serverPort,
      password,
      tls,
    };
    const obfsType = safeTransportText(source.obfs?.type, "", 32);
    const obfsPassword = String(source.obfs?.password || "");
    if (obfsType && obfsPassword) {
      outbound.obfs = { type: obfsType, password: obfsPassword };
    }
    return {
      outbound,
      fallback: false,
      sourceType: "hysteria2",
    };
  }

  return unsupportedNode(
    source,
    index,
    prefix,
    t("reason.unsupportedProtocol", {
      protocol: type || t("reason.unknownProtocol"),
    }),
  );
}

function parseEntries(entries, prefix) {
  return entries.map((entry, index) =>
    typeof entry === "string"
      ? parseLink(entry, index, prefix)
      : entry?.type
        ? parseSingBoxOutbound(entry, index, prefix)
        : parseXray(entry, index, prefix),
  );
}

// Subscription source state and rendering.



function setStatus(sourceId, message, kind = "") {
  const source = sources.get(sourceId);
  if (!source) return;
  source.status.textContent = message;
  source.status.className = `status ${kind}`.trim();
}

function selectedSourceCount(source) {
  return source.inspected.reduce(
    (count, item, index) =>
      count + (item.outbound && source.enabled[index] !== false ? 1 : 0),
    0,
  );
}

function updatePickerCount(source) {
  const found = source.inspected.length;
  const supported = source.inspected.filter((item) => item.outbound).length;
  const selected = selectedSourceCount(source);
  source.pickerCount.textContent = t("picker.count", {
    selected,
    supported,
    found,
  });
}

function filterNodePicker(source) {
  const query = source.nodeSearch.value
    .trim()
    .toLocaleLowerCase(currentNumberLocale);
  for (const row of source.nodeOptions.children) {
    row.classList.toggle(
      "hidden",
      Boolean(query) && !row.dataset.search.includes(query),
    );
  }
}

function renderNodePicker(source) {
  source.nodeOptions.replaceChildren();
  source.picker.classList.toggle("hidden", source.inspected.length === 0);
  if (source.inspected.length === 0) {
    updatePickerCount(source);
    return;
  }

  source.inspected.forEach((item, index) => {
    const supported = Boolean(item.outbound);
    const tag =
      item.outbound?.tag ||
      item.tag ||
      t("node.generated", { number: index + 1 });
    const row = document.createElement("label");
    row.className = `node-option${supported ? "" : " unsupported"}`;
    row.dataset.search = `${tag} ${item.reason || ""} ${item.sourceType || ""}`
      .toLocaleLowerCase(currentNumberLocale);

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = supported && source.enabled[index] !== false;
    checkbox.disabled = !supported;
    checkbox.setAttribute("aria-label", t("picker.addAria", { tag }));
    checkbox.addEventListener("change", () => {
      source.enabled[index] = checkbox.checked;
      updatePickerCount(source);
      updateSourceSummary();
    });

    const copy = document.createElement("span");
    copy.className = "node-option-copy";
    const name = document.createElement("span");
    name.className = "node-option-name";
    name.textContent = tag;
    const meta = document.createElement("span");
    meta.className = "node-option-meta";
    meta.textContent = supported
      ? `${item.outbound.type.toUpperCase()} · ${String(item.sourceType || t("picker.noTransport")).toUpperCase()}`
      : t("picker.unsupported", { reason: item.reason });
    copy.append(name, meta);
    row.append(checkbox, copy);
    source.nodeOptions.append(row);
  });

  updatePickerCount(source);
  filterNodePicker(source);
}

function inspectSource(source, resetSelection = false) {
  source.inspected = parseEntries(
    source.parsed,
    source.prefix.value.trim(),
  );
  if (resetSelection || source.enabled.length !== source.inspected.length) {
    source.enabled = source.inspected.map((item) => Boolean(item.outbound));
  } else {
    source.enabled = source.inspected.map(
      (item, index) => Boolean(item.outbound) && source.enabled[index] !== false,
    );
  }
  renderNodePicker(source);
  updateSourceSummary();
}

function updateSourceSummary() {
  invalidateGeneratedConfig();
  let found = 0;
  let supported = 0;
  let selected = 0;
  for (const source of sources.values()) {
    found += source.inspected?.length || 0;
    supported +=
      source.inspected?.filter((item) => item.outbound).length || 0;
    selected += source.inspected?.length
      ? selectedSourceCount(source)
      : 0;
  }
  elements.sourceSummary.textContent =
    found === 0
      ? t("summary.zeroNodes")
      : t("summary.nodes", { selected, supported, found });
}

function normalizeSubscriptionUrl(value) {
  const trimmed = value.trim();
  const happPrefix = "happ://add/";
  return trimmed.toLowerCase().startsWith(happPrefix)
    ? trimmed.slice(happPrefix.length)
    : trimmed;
}

function subscriptionUsesHwid(url) {
  try {
    return new URL(url).hostname.toLowerCase() === "sub.tconnect.services";
  } catch {
    return false;
  }
}

function renderSource(prefix = "") {
  const id = ++sourceSequence;
  const wrapper = document.createElement("article");
  wrapper.className = "source";
  wrapper.innerHTML = `
    <div class="source-grid">
      <label>
        ${t("source.urlLabel")}
        <input class="source-url" type="url" placeholder="${t("source.urlPlaceholder")}" autocomplete="off" />
      </label>
      <label>
        ${t("source.prefixLabel")}
        <input class="source-prefix" value="${prefix.replaceAll('"', "&quot;")}" placeholder="${t("source.prefixPlaceholder")}" />
      </label>
    </div>
    <div class="source-actions">
      <button class="btn btn-blue fetch-source" type="button">${t("source.fetch")}</button>
      <label class="btn file-label">
        ${t("source.file")}
        <input class="file-source" type="file" accept=".txt,.json,text/plain,application/json" />
      </label>
      <label class="hwid-toggle" title="${t("source.hwidTitle")}">
        <input class="source-use-hwid" type="checkbox" />
        <span>${t("source.hwid")}</span>
      </label>
      <button class="btn btn-danger remove-source" type="button">${t("source.remove")}</button>
    </div>
    <p class="hint">${t("source.hwidHint")}</p>
    <details>
      <summary>${t("source.manualSummary")}</summary>
      <textarea class="raw-input" spellcheck="false" placeholder="${t("source.rawPlaceholder")}"></textarea>
      <button class="btn parse-raw" type="button">${t("source.parseRaw")}</button>
    </details>
    <details class="node-picker hidden" open>
      <summary>
        <span>${t("source.selection")}</span>
        <span class="node-picker-count">${t("source.selectedZero")}</span>
      </summary>
      <div class="node-picker-toolbar">
        <input class="node-search" type="search" placeholder="${t("source.searchPlaceholder")}" aria-label="${t("source.searchAria")}" />
        <button class="btn select-supported" type="button">${t("source.selectSupported")}</button>
        <button class="btn clear-nodes" type="button">${t("source.clear")}</button>
        <button class="btn exclude-russia" type="button">${t("source.excludeRussia")}</button>
      </div>
      <div class="node-options" role="group" aria-label="${t("source.groupAria")}"></div>
    </details>
    <div class="status">${t("source.initial")}</div>
  `;
  elements.sourceList.append(wrapper);

  const source = {
    id,
    wrapper,
    url: wrapper.querySelector(".source-url"),
    prefix: wrapper.querySelector(".source-prefix"),
    raw: wrapper.querySelector(".raw-input"),
    file: wrapper.querySelector(".file-source"),
    useHwid: wrapper.querySelector(".source-use-hwid"),
    status: wrapper.querySelector(".status"),
    parsed: [],
    inspected: [],
    enabled: [],
    picker: wrapper.querySelector(".node-picker"),
    pickerCount: wrapper.querySelector(".node-picker-count"),
    nodeOptions: wrapper.querySelector(".node-options"),
    nodeSearch: wrapper.querySelector(".node-search"),
  };
  sources.set(id, source);

  wrapper
    .querySelector(".fetch-source")
    .addEventListener("click", () => fetchSource(id));
  wrapper.querySelector(".parse-raw").addEventListener("click", () => {
    parseSourceText(id, source.raw.value);
  });
  source.prefix.addEventListener("input", () => {
    if (source.parsed.length) inspectSource(source, false);
  });
  source.nodeSearch.addEventListener("input", () => {
    filterNodePicker(source);
  });
  wrapper.querySelector(".select-supported").addEventListener("click", () => {
    source.enabled = source.inspected.map((item) => Boolean(item.outbound));
    renderNodePicker(source);
    updateSourceSummary();
  });
  wrapper.querySelector(".clear-nodes").addEventListener("click", () => {
    source.enabled = source.inspected.map(() => false);
    renderNodePicker(source);
    updateSourceSummary();
  });
  wrapper.querySelector(".exclude-russia").addEventListener("click", () => {
    source.enabled = source.inspected.map(
      (item, index) =>
        Boolean(item.outbound) &&
        source.enabled[index] !== false &&
        !isRussianNodeTag(item.outbound?.tag || item.tag),
    );
    renderNodePicker(source);
    updateSourceSummary();
  });
  source.file.addEventListener("change", async () => {
    const file = source.file.files?.[0];
    if (!file) return;
    parseSourceText(id, await file.text());
  });
  wrapper
    .querySelector(".remove-source")
    .addEventListener("click", () => {
      sources.delete(id);
      wrapper.remove();
      updateSourceSummary();
    });
  return source;
}

function parseSourceText(id, text) {
  const source = sources.get(id);
  if (!source) return;
  try {
    const entries = decodeSubscription(text);
    source.parsed = entries;
    source.raw.value = text;
    inspectSource(source, true);
    const onlyItem = source.inspected[0];
    const onlyTag = onlyItem?.outbound?.tag || onlyItem?.tag || "";
    if (
      source.inspected.length === 1 &&
      onlyTag.toLocaleLowerCase("ru-RU").includes("приложение не поддерживается")
    ) {
      throw new Error(t("source.providerStub"));
    }
    const supported = source.inspected.filter((item) => item.outbound).length;
    const skipped = source.inspected.length - supported;
    setStatus(
      id,
      skipped
        ? t("source.loadedWithSkipped", {
            found: entries.length,
            supported,
            skipped,
          })
        : t("source.loaded", { count: entries.length }),
      skipped ? "warn" : "ok",
    );
  } catch (error) {
    source.parsed = [];
    source.inspected = [];
    source.enabled = [];
    renderNodePicker(source);
    setStatus(id, t("source.error", { message: error.message }), "bad");
    updateSourceSummary();
  }
}

async function fetchSource(id) {
  const source = sources.get(id);
  if (!source) return;
  const rawUrl = source.url.value.trim();
  const fromHappLink = rawUrl.toLowerCase().startsWith("happ://add/");
  const url = normalizeSubscriptionUrl(rawUrl);
  if (!url) {
    setStatus(id, t("source.enterUrl"), "warn");
    return;
  }
  if (fromHappLink || subscriptionUsesHwid(url)) {
    source.useHwid.checked = true;
    source.url.value = url;
  }
  setStatus(id, t("source.loading"));
  try {
    let text;
    if (backendAvailable) {
      const response = await fetch("/api/fetch-subscription", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept-Language": currentLocale,
        },
        body: JSON.stringify({
          url,
          useHwid: source.useHwid.checked,
          locale: currentLocale,
        }),
      });
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || `HTTP ${response.status}`);
      }
      text = payload.text;
    } else if (source.useHwid.checked) {
      throw new Error(t("source.hwidNeedsBackend"));
    } else if (location.protocol !== "file:") {
      const response = await fetch(url, {
        cache: "no-store",
        redirect: "follow",
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      text = await response.text();
    } else {
      throw new Error(t("source.fileNeedsBackend"));
    }
    parseSourceText(id, text);
  } catch (error) {
    setStatus(
      id,
      t("source.fetchFailed", { message: error.message }),
      "bad",
    );
  }
}

async function checkBackend() {
  if (location.protocol === "file:") {
    backendAvailable = false;
    elements.backendHelp.textContent = t("backend.fileHelp");
    return;
  }
  try {
    const response = await fetch("/api/health", { cache: "no-store" });
    if (!response.ok) throw new Error();
    backendAvailable = true;
  } catch {
    backendAvailable = false;
    elements.backendHelp.textContent = t("backend.unavailable");
  }
}

const baseConfig = JSON.parse(
  document.getElementById("baseConfig").textContent,
);
const baseDomains = [
  ...baseConfig.route.rule_set[0].rules[0].domain_suffix,
];
const sources = new Map();
let sourceSequence = 0;
let generatedConfig = null;
let backendAvailable = false;
const SETTINGS_STORAGE_KEY = "sing-box-config-builder.settings.v3";
const MIN_HEALTH_INTERVAL_MS = 10 * 60 * 1000;

const elements = {
  sourceList: document.getElementById("sourceList"),
  sourceSummary: document.getElementById("sourceSummary"),
  directDomains: document.getElementById("directDomains"),
  domainCount: document.getElementById("domainCount"),
  healthInterval: document.getElementById("healthInterval"),
  controllerAddress: document.getElementById("controllerAddress"),
  controllerSecret: document.getElementById("controllerSecret"),
  tunName: document.getElementById("tunName"),
  buildStatus: document.getElementById("buildStatus"),
  jsonOutput: document.getElementById("jsonOutput"),
  downloadConfig: document.getElementById("downloadConfig"),
  copyConfig: document.getElementById("copyConfig"),
  nodeStat: document.getElementById("nodeStat"),
  skippedStat: document.getElementById("skippedStat"),
  directStat: document.getElementById("directStat"),
  skippedDetails: document.getElementById("skippedDetails"),
  toast: document.getElementById("toast"),
  backendHelp: document.getElementById("backendHelp"),
};

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function showToast(message) {
  elements.toast.textContent = message;
  elements.toast.classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(
    () => elements.toast.classList.add("hidden"),
    2600,
  );
}

function parseDuration(value) {
  const match = String(value || "").match(/^(\d+)(ms|s|m|h)$/);
  if (!match || Number(match[1]) < 1) return 0;
  const factors = { ms: 1, s: 1000, m: 60_000, h: 3_600_000 };
  return Number(match[1]) * factors[match[2]];
}

function loadSettings() {
  try {
    const value = JSON.parse(
      localStorage.getItem(SETTINGS_STORAGE_KEY) || "{}",
    );
    return value && typeof value === "object" ? value : {};
  } catch {
    return {};
  }
}

function persistSettings() {
  try {
    localStorage.setItem(
      SETTINGS_STORAGE_KEY,
      JSON.stringify({
        healthInterval: elements.healthInterval.value.trim(),
        controllerAddress: elements.controllerAddress.value.trim(),
        controllerSecret: elements.controllerSecret.value,
        tunName: elements.tunName.value.trim(),
      }),
    );
  } catch {
    // The builder still works when browser storage is disabled.
  }
}

function initializeSettings() {
  const saved = loadSettings();
  elements.healthInterval.value = saved.healthInterval || "20m";
  elements.controllerAddress.value =
    saved.controllerAddress || "0.0.0.0:9090";
  elements.controllerSecret.value =
    saved.controllerSecret ||
    baseConfig.experimental?.clash_api?.secret ||
    randomSecret();
  elements.tunName.value = saved.tunName || "singtun0";
  persistSettings();
}

function randomSecret() {
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  const suffix = [...bytes]
    .map((value) => value.toString(16).padStart(2, "0"))
    .join("");
  return `SINGBOX-${suffix}`;
}

function normalizeDomain(line) {
  let value = line.trim().toLowerCase();
  if (!value || value.startsWith("#")) return "";
  if (value.includes("://")) {
    try {
      value = new URL(value).hostname;
    } catch {
      return "";
    }
  } else {
    value = value.split("/")[0].split(":")[0];
  }
  return value.replace(/^\.+|\.+$/g, "");
}

function normalizedDomains() {
  return [
    ...new Set(
      elements.directDomains.value
        .split(/\r?\n/)
        .map(normalizeDomain)
        .filter(
          (domain) =>
            domain &&
            domain.length <= 253 &&
            /^[a-z0-9._-]+$/.test(domain),
        ),
    ),
  ].sort();
}

function updateDomainCount() {
  const count = normalizedDomains().length;
  elements.domainCount.textContent = t("domain.count", { count });
}

function isRussianNodeTag(tag) {
  const value = String(tag || "").toLocaleLowerCase(currentNumberLocale);
  return (
    value.includes("🇷🇺") ||
    value.includes("росси") ||
    value.includes("russia")
  );
}

function invalidateGeneratedConfig() {
  if (!generatedConfig) return;
  generatedConfig = null;
  elements.downloadConfig.disabled = true;
  elements.copyConfig.disabled = true;
  elements.buildStatus.textContent = t("config.invalidated");
  elements.buildStatus.className = "status warn";
}

function settingError(message) {
  elements.buildStatus.textContent = message;
  elements.buildStatus.className = "status bad";
  return false;
}

function validateSettings() {
  const interval = elements.healthInterval.value.trim();
  const intervalMs = parseDuration(interval);
  if (!intervalMs) {
    return settingError(t("validation.intervalFormat"));
  }
  if (intervalMs < MIN_HEALTH_INTERVAL_MS) {
    return settingError(t("validation.intervalMinimum"));
  }

  const controller = elements.controllerAddress.value.trim();
  const controllerMatch = controller.match(/^(.+):(\d{1,5})$/);
  const controllerPort = Number(controllerMatch?.[2] || 0);
  if (
    !controllerMatch ||
    controllerPort < 1 ||
    controllerPort > 65535
  ) {
    return settingError(t("validation.controller"));
  }

  const tunName = elements.tunName.value.trim();
  if (!/^[a-zA-Z0-9_.-]{1,15}$/.test(tunName)) {
    return settingError(t("validation.tunName"));
  }

  if (!elements.controllerSecret.value) {
    elements.controllerSecret.value = randomSecret();
  }
  if (elements.controllerSecret.value.length < 8) {
    return settingError(t("validation.secret"));
  }
  persistSettings();
  return true;
}

function buildConfig() {
  const parsedNodes = [];
  let foundCount = 0;
  let disabledCount = 0;
  for (const source of sources.values()) {
    if (!source.parsed?.length) continue;
    if (source.inspected.length !== source.parsed.length) {
      inspectSource(source, false);
    }
    foundCount += source.inspected.length;
    source.inspected.forEach((item, index) => {
      if (item.outbound && source.enabled[index] === false) {
        disabledCount += 1;
        return;
      }
      parsedNodes.push(item);
    });
  }
  if (foundCount === 0) {
    elements.buildStatus.textContent = t("config.noLoadedNodes");
    elements.buildStatus.className = "status bad";
    return;
  }

  if (!validateSettings()) return;

  const supportedNodes = parsedNodes.filter((item) => item.outbound);
  const skippedNodes = parsedNodes.filter((item) => !item.outbound);
  const nodes = supportedNodes.map((item) => clone(item.outbound));
  if (nodes.length === 0) {
    elements.buildStatus.textContent =
      disabledCount > 0
        ? t("config.chooseTunnel")
        : t("config.noSupported", { found: foundCount });
    elements.buildStatus.className = "status bad";
    elements.skippedStat.textContent = skippedNodes.length + disabledCount;
    elements.skippedDetails.textContent =
      disabledCount > 0
        ? t("config.disabled", { count: disabledCount })
        : t("config.xhttpOnly");
    elements.skippedDetails.classList.remove("hidden");
    return;
  }
  makeTagsUnique(nodes);
  const nodeTags = nodes.map((node) => node.tag);
  const domains = normalizedDomains();
  const config = clone(baseConfig);

  config.inbounds[0].interface_name =
    elements.tunName.value.trim() || "singtun0";
  config.experimental.clash_api.external_controller =
    elements.controllerAddress.value.trim() || "0.0.0.0:9090";
  config.experimental.clash_api.secret =
    elements.controllerSecret.value;
  config.outbounds = [
    {
      type: "selector",
      tag: "SELECT",
      outbounds: ["DIRECT", "AUTO", ...nodeTags],
      default: "DIRECT",
      interrupt_exist_connections: true,
    },
    {
      type: "urltest",
      tag: "AUTO",
      outbounds: nodeTags,
      url: "https://www.gstatic.com/generate_204",
      interval: elements.healthInterval.value.trim() || "20m",
      tolerance: 50,
      interrupt_exist_connections: false,
    },
    {
      type: "direct",
      tag: "DIRECT",
    },
    ...nodes,
  ];
  config.route.final = "SELECT";
  config.route.auto_detect_interface = true;
  config.route.rule_set[0].rules[0].domain_suffix = domains;

  const json = `${JSON.stringify(config, null, 2)}\n`;
  generatedConfig = json;
  elements.jsonOutput.value = json;
  elements.downloadConfig.disabled = false;
  elements.copyConfig.disabled = false;
  elements.nodeStat.textContent = nodes.length;
  elements.skippedStat.textContent = skippedNodes.length + disabledCount;
  if (skippedNodes.length || disabledCount) {
    const reasons = new Map();
    for (const item of skippedNodes) {
      reasons.set(item.reason, (reasons.get(item.reason) || 0) + 1);
    }
    if (disabledCount) {
      reasons.set(t("config.disabledReason"), disabledCount);
    }
    elements.skippedDetails.textContent = t("config.notAdded", {
      reasons: [...reasons]
        .map(([reason, count]) => `${reason} — ${count}`)
        .join("; "),
    });
    elements.skippedDetails.classList.remove("hidden");
  } else {
    elements.skippedDetails.textContent = "";
    elements.skippedDetails.classList.add("hidden");
  }
  elements.directStat.textContent = domains.length;
  const skippedCount = skippedNodes.length + disabledCount;
  elements.buildStatus.textContent = t("config.ready", {
    count: nodes.length,
    suffix: skippedCount
      ? t("config.skippedSuffix", { count: skippedCount })
      : t("config.noSkippedSuffix"),
  });
  elements.buildStatus.className = "status ok";
  showToast(t("toast.built"));
}

function downloadConfig() {
  if (!generatedConfig) return;
  const blob = new Blob([generatedConfig], {
    type: "application/json;charset=utf-8",
  });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "config.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

async function copyText(text, message) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  showToast(message);
}
